name: release

# Push a tag such as v0.1.0 to publish the firmware: the .bin and its sha256 become release assets.
on:
  push:
    tags: ["v*"]

env:
  VIAL_QMK_COMMIT: dd43959ae5c08d8a28d38a1acf7b04e86b14a344

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: port

      - name: Fetch vial-qmk at the pinned commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/vial-kb/vial-qmk.git vial-qmk
          git -C vial-qmk checkout "$VIAL_QMK_COMMIT"
          git -C vial-qmk submodule update --init --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi dfu-util
          pip install qmk==1.2.0 -r vial-qmk/requirements.txt

      - name: Build
        run: |
          cp -R port/keyboards/nuphy vial-qmk/keyboards/
          cd vial-qmk
          QMK_HOME="$PWD" make nuphy/air60_v2/ansi:vial
          python3 ../port/tools/check_size.py nuphy_air60_v2_ansi_vial.bin
          cp nuphy_air60_v2_ansi_vial.bin "nuphy_air60_v2_ansi_vial-${GITHUB_REF_NAME}.bin"
          sha256sum "nuphy_air60_v2_ansi_vial-${GITHUB_REF_NAME}.bin" > "nuphy_air60_v2_ansi_vial-${GITHUB_REF_NAME}.bin.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            vial-qmk/nuphy_air60_v2_ansi_vial-*.bin
            vial-qmk/nuphy_air60_v2_ansi_vial-*.bin.sha256
